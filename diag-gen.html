<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b1a">
<title>🔬 端末内生成テスト — 運気の女神</title>
<style>
  :root { --ink:#0d0b1a; --card:#1a1730; --border:rgba(255,255,255,.12); --gold:#e8c96a; --rose:#f49aad; --violet:#a78bfa; --green:#6ee7b7; --text:#f0eaff; --muted:#8b80ac; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--text); font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.25rem; color: var(--gold); margin-bottom: 6px; }
  .lead { font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
  .warn { font-size: .76rem; background: rgba(244,154,173,.1); border: 1px solid rgba(244,154,173,.35); color: var(--rose); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }
  button { flex: 1; padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(167,139,250,.45); background: rgba(167,139,250,.16); color: var(--text); font-size: .85rem; font-weight: 700; cursor: pointer; }
  button.sub { flex: 0 0 auto; background: none; border-color: var(--border); color: var(--muted); font-weight: 400; font-size: .74rem; }
  button:disabled { opacity: .45; }
  #verdict { border-radius: 14px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); background: var(--card); display: none; }
  #verdict h2 { font-size: 1rem; color: var(--gold); margin-bottom: 8px; }
  .tier { font-size: .8rem; padding: 6px 0; border-top: 1px solid var(--border); }
  .tier b { color: var(--text); }
  .tier .why { display: block; font-size: .7rem; color: var(--muted); }
  .sec { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; }
  .sec h3 { font-size: .84rem; display: flex; justify-content: space-between; gap: 8px; }
  .sec h3 span { font-weight: 400; font-size: .74rem; color: var(--muted); white-space: nowrap; }
  .sec .body { font-size: .72rem; color: #cfc6ea; margin-top: 6px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Menlo, monospace; }
  .sec .body:empty { display: none; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--gold)); }
  .ok { color: var(--green); } .ng { color: var(--rose); } .run { color: var(--gold); }
  #copyBtn { width: 100%; margin: 6px 0 10px; display: none; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(20,17,40,.96); border: 1px solid rgba(167,139,250,.4); border-radius: 12px; padding: 9px 16px; font-size: .78rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
  a { color: var(--violet); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 端末内生成テスト</h1>
  <p class="lead">強制終了の原因（GPUへの命令が3秒で終わらないと Safari が止める仕組み）への対策版を試します。所要時間は5〜8分です。<br>
    使うモデル: <b id="tierName">確認中…</b></p>
  <div class="warn">⚠ 途中で画面が真っ白になったり、勝手に再読み込みされることがあります（それが調べたい現象です）。<br>
    「問題が繰り返し起きました」と出ても、<b>このページを開き直せば続きから自動で再開</b>します。全部の手順が終わるまで、開き直しを繰り返してください。<br>
    他のアプリを閉じてから実行してください。通信は使いません。</div>
  <div class="row">
    <button id="startBtn">▶ テストを開始</button>
    <button id="resetBtn" class="sub">最初からやり直す</button>
  </div>
  <div id="verdict"></div>
  <div id="sections"></div>
  <button id="copyBtn">📋 結果をコピー</button>
  <p class="lead"><a href="index.html">← アプリに戻る</a>　<a href="diag.html">📱 実機診断（基本）</a></p>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════
   端末内生成テスト（第11回）: 送信の待ち合わせ版を試す
   - アプリが保存したモデル（OPFS: lgo-localgen/<tier>/）を使う。通信なし
   - 手順ごと・手順内の段階ごとに localStorage へ記録 → 落ちても開き直せば
     「どの手順の、どの段階で落ちたか」が残り、次の手順から再開する
   - 第8回まで: 192×256 以下は毎回成功、256×384 以上はほぼ毎回強制終了（描画部品だけでも）。
     Node.js + Dawn では同じモデル・同じ大きさでエラー0件・GPUメモリ約600MB
   - 第9回: ① GPU メモリをどこまで確保できるか（計算なし）を測る
            ② 大きな中間結果を作る計算を小分けにした描画部品で 256×384 / 448×640 を試す
              ・自己注意（画素どうしの関係の表）: 448×640 で 1個 306MB → 10MB 以下
              ・全結合（1画素ずつの拡大→縮小）: 1個 22MB → 6MB 以下
              Dawn で出力は元と完全一致。256×384 の GPU メモリ最大 596MB → 502MB（192×256 の元の版と同じ水準）
   - 第9回の結論: GPU メモリは 1.5GB まで確保できた（量は原因でない）。強制終了の記録（com.apple.WebKit.GPU）は
     WebGPU::crashGPUProcess ← Queue::commitMTLCommandBuffer の3秒タイマー。WebKit は送った命令のまとまりが
     3秒以内に終わらないと GPU プロセスを落とす。448×640 は描画18工程を完走し、仕上げ（VAE）で落ちた
   - 第10回: 1回に送る命令を2個にし、GPU に預ける量を実行時間の見積もりで抑える（local-gen-run-worker.js の installPace）。
     各段階で「GPU待ち 最大◯秒」を記録する（3秒に近いほど危ない）
   - 第10回: 待ち合わせ版は「GPU待ち」最大0.79秒（3秒より十分短い）なのに、描画開始直後や2回目の実行中に落ちた。
     読み込み中にも送信を待たせて転送用の一時バッファがたまっていたため、第11回は実行中（session.run）だけ待たせる
   - URL パラメータ（動作確認用）: ?tier=M|S&ep=webgpu|wasm&sizes=128x128&pace=0（pace=0 で待ち合わせなし）
   ════════════════════════════════════════════════════════════ */
const KEY = 'lgo_diag_gen_v4';
const MB = 1048576;
const Q = new URLSearchParams(location.search);
const EP = Q.get('ep') || 'webgpu';
const ROOT_DIR = 'lgo-localgen';
const COMP = 'unet';
const AV = '2026-11-14b';
const PROMPT = 'a beautiful young woman, long black hair, gentle smile, soft light, portrait', NEG = 'lowres, bad anatomy';
const TEST_SZ = Q.get('sizes') ? Q.get('sizes').split(',')[0].split('x').map(Number) : null;   // 動作確認用に全部この大きさで
const SZ = sz => TEST_SZ || sz;
const STEPS_N = TEST_SZ ? 2 : 18;
const U = (sz, runs) => ({ unet: { w: SZ(sz)[0], h: SZ(sz)[1], runs, emb: 'synthetic', sample: 'sin', timestep: 500 } });
const STEPS = [
  { id: 'env', title: '1. 準備（保存済みモデルの確認）',                       run: stepEnv },
  { id: 'v0',  title: '2. 部品の版と Worker の確認',                           run: stepProbe },
  { id: 'y1',  title: `3. 描画部品だけ（${SZ([256, 384]).join('×')}・2回）`, run: s => stepDiag(s, U([256, 384], 2)), reloadBefore: true },
  { id: 'g1',  title: `4. 本番どおりの生成（軽量 ${SZ([256, 384]).join('×')}・${STEPS_N}工程）`, run: s => stepGen(s, SZ([256, 384])), reloadBefore: true },
  { id: 'g2',  title: `5. 本番どおりの生成（軽量 ${SZ([448, 640]).join('×')}・${STEPS_N}工程）`, run: s => stepGen(s, SZ([448, 640])), reloadBefore: true },
];
let state = load() || { v: 4, inProgress: false, steps: {} };
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
const fmtMB = mb => mb >= 1024 ? (mb / 1024).toFixed(2) + ' GB' : Math.round(mb) + ' MB';
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = '1'; setTimeout(() => { t.style.opacity = '0'; }, 2200); }
function withTimeout(p, ms, label) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' が' + ms / 1000 + '秒以内に終わりませんでした')), ms))]);
}
// 段階の記録（落ちた時に「どこまで進んだか」を残す）
function mark(s, text, extra) {
  s.mark = text; s.t = Math.round(performance.now() - (s._t0 || 0));
  (s.log = s.log || []).push(`${(s.t / 1000).toFixed(1)}秒 ${text}`);
  if (extra) Object.assign(s, extra);
  save(); render();
}

async function dirOf(sub) {
  let d = await navigator.storage.getDirectory();
  for (const p of [ROOT_DIR, ...sub.split('/')].filter(Boolean)) d = await d.getDirectoryHandle(p);
  return d;
}
async function savedFile(tier, name) {
  try { return await (await (await dirOf(tier)).getFileHandle(name)).getFile(); } catch (e) { return null; }
}
// 使うモデル: 指定があればそれ、なければ軽量(S)→標準(M)
async function pickTier() {
  if (state.tier) return state.tier;
  const want = Q.get('tier');
  for (const t of want ? [want] : ['S', 'M']) if (await savedFile(t, COMP + '.onnx')) return (state.tier = t);
  return null;
}
const TIER_LABEL = { S: '軽量（4bit）', M: '標準（fp16）' };
async function getDevice() {
  if (!navigator.gpu) throw new Error('WebGPU に対応していません');
  const ad = await withTimeout(navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }), 10000, 'GPUの取得');
  if (!ad) throw new Error('GPU を取得できません');
  return ad.requestDevice({ requiredLimits: { maxBufferSize: ad.limits.maxBufferSize, maxStorageBufferBindingSize: ad.limits.maxStorageBufferBindingSize } });
}

// ════════════════ 1. 準備 ════════════════
async function stepEnv(s) {
  const tier = await pickTier();
  if (!tier) throw new Error('端末内生成のモデルが保存されていません。アプリの ⚙設定 →「📴 端末内生成」で保存してから実行してください');
  s.data = { tier: tier + ' ' + TIER_LABEL[tier] };
  for (const c of ['text_encoder', 'unet', 'vae_decoder']) {
    const f = await savedFile(tier, c + '.onnx');
    s.data[c] = f ? fmtMB(f.size / MB) : 'なし';
  }
  const g = await fetch(`assets/ai/graphs/${tier}/${COMP}.onnx?v=${AV}`);
  const kb = g.ok ? Math.round((await g.arrayBuffer()).byteLength / 1024) : 0;
  s.data.graph = g.ok ? `OK（${kb}KB${kb > 850 ? '・小分け版' : '・古い版'}）` : 'HTTP ' + g.status;
  try {
    const ad = await navigator.gpu.requestAdapter();
    if (ad) { s.data.maxBufferSize = fmtMB(ad.limits.maxBufferSize / MB); s.data.maxStorageBinding = fmtMB(ad.limits.maxStorageBufferBindingSize / MB); }
    else s.data.maxBufferSize = 'GPUなし';
  } catch (e) { s.data.maxBufferSize = '取得失敗'; }
  if (navigator.deviceMemory) s.data.deviceMemory = navigator.deviceMemory + 'GB';
  s.ok = g.ok;
  s.summary = `${TIER_LABEL[tier]}・unet ${s.data.unet}`;
}

function loadScript(src) {
  return new Promise((res, rej) => { const e = document.createElement('script'); e.src = src; e.onload = res; e.onerror = () => rej(new Error('読み込めません: ' + src)); document.head.appendChild(e); });
}
async function useLocalGen() {
  if (!window.LOCAL_GEN) await loadScript('assets/ai/local-gen.js?v=' + AV);
  if (Q.get('ep')) LOCAL_GEN._configure({ ep: Q.get('ep') });
  if (Q.get('pace') === '0') LOCAL_GEN._configure({ pace: null });
  await LOCAL_GEN.status();
}
// 2. 版と Worker の確認
async function stepProbe(s) {
  await useLocalGen();
  const p = await LOCAL_GEN.workerProbe();
  s.data = { 'アプリ側の版': LOCAL_GEN.version || '古い版', 'Worker の版': p.version || '古い版', 'Worker で WebGPU': p.gpu ? 'あり' : 'なし',
             'GPU 取得': p.adapter ? 'OK' : '—', '半精度(f16)': p.f16 ? 'OK' : '—', '同期ファイル読み込み': p.sync ? 'OK' : 'なし' };
  const fresh = LOCAL_GEN.version === AV && p.version === AV;
  s.ok = p.ok && fresh;
  s.summary = !fresh ? '古い版のままです（アプリを開き直してください）' : p.ok ? `OK（版 ${AV}）` : '不可: ' + p.reason;
  if (!fresh) throw new Error('古い版の部品が読み込まれています。アプリを2回開き直してから「最初からやり直す」を押してください');
}
// 4〜5. アプリと同じ生成（LOCAL_GEN.generate）
const PH = { 'text_encoder:load': '文章部品の読込', 'text_encoder:run': '文章部品の作成完了', text: '文章の解析',
  'unet:load': '描画部品の読込', 'unet:run': '描画部品の作成完了→描画開始', unet: '描画', 'vae_decoder:load': '仕上げ部品の読込', 'vae_decoder:run': '仕上げ部品の作成完了', vae: '仕上げ' };
async function stepGen(s, size) {
  await useLocalGen();
  const st = await LOCAL_GEN.status();
  const tier = st.tiers.S && st.tiers.S.ready ? 'S' : state.tier;
  const [w, h] = size;
  let last = '';
  mark(s, `${w}×${h}・${STEPS_N}工程 生成開始`); await sleep(100);
  const t0 = performance.now();
  const r = await LOCAL_GEN.generate({ prompt: PROMPT, negative: NEG, seed: 1234, tier, size: { w, h }, steps: STEPS_N,
    onLog: text => mark(s, '［' + text + '］'),
    onProgress: (ph, f) => {
      const k = ph + Math.round(f * 100); if (k === last) return; last = k;
      if (ph === 'unet' && f < 1 && Math.round(f * STEPS_N) % 6) return;   // 記録を間引く
      mark(s, ph === 'unet' ? `描画 ${Math.round(f * 100)}%` : (PH[ph] || ph) + (ph === 'text' || ph === 'vae' ? (f >= 1 ? ' 完了' : ' 開始') : ''));
    } });
  if (r.width !== w) throw new Error(`メモリ不足で ${r.width}×${r.height} に縮小されました`);
  mark(s, `完了（全体 ${((performance.now() - t0) / 1000).toFixed(1)}秒・1工程 ${(r.msPerStep / 1000).toFixed(1)}秒）`);
  try {   // 記録を圧迫しないよう、ごく小さいJPEGで目視確認用に残す
    const bm = await createImageBitmap(r.blob), cv = document.createElement('canvas');
    cv.width = 72; cv.height = Math.round(72 * r.height / r.width);
    cv.getContext('2d').drawImage(bm, 0, 0, cv.width, cv.height);
    s.thumb = cv.toDataURL('image/jpeg', 0.7);
  } catch (e) {}
  await sleep(2000);
  mark(s, '完了後 2秒 生存');
  s.ok = true; s.summary = `OK（1工程 ${(r.msPerStep / 1000).toFixed(1)}秒・全体 ${(r.ms / 1000).toFixed(0)}秒）`;
}
// 3. 描画部品だけを Worker で動かす
async function stepDiag(s, plan) {
  await useLocalGen();
  if (!LOCAL_GEN.diagRun) throw new Error('古い版の部品です（開き直してください）');
  const out = await LOCAL_GEN.diagRun(state.tier, Object.assign({ prompt: PROMPT, negative: NEG }, plan), text => mark(s, text));
  s.data = {};
  for (const [k, v] of Object.entries(out || {})) s.data[k] = JSON.stringify(v);
  await sleep(1500);
  mark(s, '終了後 1.5秒 生存');
  const bad = Object.values(out || {}).some(v => v && v.異常値 > 0);
  s.ok = true; s.summary = bad ? 'OK（ただし出力に異常値あり）' : 'OK';
}

// ════════════════ 判定 ════════════════
const fin = s => s && (s.status === 'done' || s.status === 'crashed' || s.status === 'error');
const allDone = () => STEPS.every(d => fin(state.steps[d.id]));
function verdict() {
  const st = state.steps, bad = id => st[id] && (st[id].status === 'crashed' || st[id].status === 'error' || st[id].ok === false);
  if (bad('env')) return '準備に失敗（モデル未保存など）';
  if (bad('v0')) return '古い版の部品が読み込まれています（アプリを2回開き直してから、最初からやり直してください）';
  const at = id => !st[id] ? '未実施' : st[id].status === 'crashed' ? `💥（${st[id].mark || '?'}）` : st[id].status === 'error' ? `⚠（${st[id].error}）` : `○ ${st[id].summary || ''}`;
  const lines = STEPS.slice(2).map(d => `${d.title.replace(/^\d+\.\s*/, '')}: ${at(d.id)}`);
  const ok = id => st[id] && st[id].status === 'done', ng = id => st[id] && st[id].status === 'crashed';
  const msg = [];
  if (ok('g2')) msg.push('448×640 の本番生成に成功 → アプリでも端末内生成が使えます（⚙設定で「常に使う」を押すと一時停止が解除されます）');
  else if (ok('g1')) msg.push('256×384 は成功、448×640 は失敗 → 送信の待ち合わせをさらに細かくするか、この端末は 256×384（拡大して仕上げ）にします');
  else if (ok('y1')) msg.push('描画部品だけなら動くが、通しの生成で落ちる → 記録の「GPU待ち」の値を見て調整します');
  else msg.push('対策後も落ちる → 強制終了の記録（com.apple.WebKit.GPU）の中身で、別の原因か確かめます');
  if (ng('g1') || ng('g2') || ng('y1')) msg.push('解析データ（設定 → プライバシーとセキュリティ → 解析と改善 → 解析データ）で、テストした時刻の記録（com.apple.WebKit.GPU / WebContent / JetsamEvent）を送ってください');
  return lines.join('\n') + (msg.length ? '\n→ ' + msg.join('\n→ ') : '');
}

// ════════════════ 表示 ════════════════
const ICON = { done: '✅', error: '⚠️', crashed: '💥', running: '⏳' };
function bodyText(s) {
  const log = (s.log || []).join('\n');
  const data = s.data ? Object.entries(s.data).map(([k, v]) => `${k}: ${v}`).join('\n') + '\n' : '';
  if (s.status === 'crashed') return `💥 この手順の途中でページが強制終了されました\n最後に記録された段階: ${s.mark || '開始直後'}\n${log}`;
  if (s.status === 'error') return `エラー: ${s.error}\n最後の段階: ${s.mark || '—'}\n${log}`;
  return data + log;
}
function render() {
  $('sections').innerHTML = STEPS.map(d => {
    const s = state.steps[d.id];
    const right = !s ? '未実施' : s.status === 'running' ? `<span class="run">${esc(s.mark || '実行中…')}</span>`
      : `${ICON[s.status] || ''} ${esc(s.summary || (s.status === 'crashed' ? '強制終了' : ''))}`;
    const pct = s && s.status === 'running' && s.capMB ? Math.round((s.reachedMB || 0) / s.capMB * 100) : 0;
    return `<div class="sec"><h3>${d.title}<span>${right}</span></h3>
      <div class="bar" style="display:${s && s.status === 'running' && s.capMB ? 'block' : 'none'}"><i style="width:${pct}%"></i></div>
      <div class="body">${s && s.status !== 'running' ? esc(bodyText(s)) : ''}</div>${s && s.thumb ? `<img src="${s.thumb}" alt="" style="width:96px;border-radius:8px;margin-top:6px">` : ''}</div>`;
  }).join('');
  $('tierName').textContent = state.tier ? `${state.tier} ${TIER_LABEL[state.tier]}` : '（開始時に決定）';
  const v = $('verdict');
  if (allDone()) {
    v.style.display = 'block';
    v.innerHTML = `<h2>結果</h2><div class="tier" style="white-space:pre-wrap">${esc(verdict())}</div>`;
    $('copyBtn').style.display = 'block';
  } else { v.style.display = 'none'; $('copyBtn').style.display = 'none'; }
  $('startBtn').disabled = state.inProgress || allDone();
  $('startBtn').textContent = state.inProgress ? '⏳ テスト中…' : allDone() ? '✔ テスト済み' : '▶ テストを開始';
}
function reportText() {
  const lines = ['【LGO3 端末内生成テスト】 ' + new Date().toLocaleString('ja-JP'),
    `モデル: ${state.tier} ${TIER_LABEL[state.tier] || ''} / 実行: ${EP}`, `結果: ${verdict()}`, '', navigator.userAgent, ''];
  for (const d of STEPS) {
    const s = state.steps[d.id]; if (!s) continue;
    lines.push(`■ ${d.title} — ${s.status === 'crashed' ? '💥強制終了' : s.status === 'error' ? 'エラー' : s.summary || ''}`, bodyText(s), '');
  }
  return lines.join('\n');
}
async function copyReport() {
  const text = reportText();
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) { ta.remove(); toast('コピーできませんでした'); return; }
    ta.remove();
  }
  toast('✅ 結果をコピーしました。チャットに貼り付けてください');
}

// ════════════════ 実行 ════════════════
async function runAll() {
  state.inProgress = true; save(); render();
  for (const d of STEPS) {
    const prev = state.steps[d.id];
    if (prev && prev.status !== 'running') continue;              // 済み
    if (prev && prev.status === 'running') { prev.status = 'crashed'; save(); render(); continue; }   // 前回ここで落ちた
    const pre = ['env', 'v0'].find(k => k !== d.id && STEPS.findIndex(x => x.id === k) < STEPS.indexOf(d) && state.steps[k] && state.steps[k].status !== 'done');
    if (pre) {                                                     // 準備・版の確認に失敗したら以降は実施しない
      state.steps[d.id] = { status: 'error', error: (pre === 'env' ? '準備' : '版の確認') + 'に失敗したため未実施', summary: '未実施' }; save(); continue;
    }
    if (d.reloadBefore && !state.fresh) {                          // 前の手順のメモリを持ち越さないよう、開き直してから
      state.fresh = d.id; save(); location.reload(); return;
    }
    state.fresh = null;
    const s = state.steps[d.id] = { status: 'running', _t0: performance.now() };
    mark(s, '開始');
    try {
      await d.run(s);
      s.status = 'done';
    } catch (e) { s.status = 'error'; s.error = String(e && e.message || e); s.summary = 'エラー'; }
    delete s._t0; save(); render();
    await sleep(800);
  }
  state.inProgress = false; save(); render();
}
$('startBtn').onclick = () => { if (!state.inProgress) runAll(); };
$('resetBtn').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.replace(location.pathname + location.search); };
$('copyBtn').onclick = copyReport;
render();
if (state.inProgress) { toast('前回の続きから再開します'); setTimeout(runAll, 1200); }
</script>
</body>
</html>
